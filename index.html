<!doctype html>
<html lang="ar" dir="rtl" id="htmlTag">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Invoice Chaser</title>
    <meta
      name="description"
      content="تابع فواتيرك المستحقة وذكّر عملاءك بالدفع عبر واتساب أو البريد بضغطة واحدة."
    />
    <meta name="theme-color" content="#0e6b62" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'none'; object-src 'none'"
    />
    <link rel="manifest" href="manifest.webmanifest" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%230e6b62'/%3E%3Cpath d='M8 5h6l3 3v11H8zM10 14l2 2 3-4' fill='none' stroke='%23fff' stroke-width='1.6'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <svg class="sprite" aria-hidden="true">
      <symbol id="i-doc" viewBox="0 0 24 24">
        <path d="M7 3h7l4 4v14H7z" />
        <path d="M14 3v4h4M10 14l2 2 3-4" />
      </symbol>
      <symbol id="i-plus" viewBox="0 0 24 24">
        <path d="M12 5v14M5 12h14" />
      </symbol>
      <symbol id="i-mail" viewBox="0 0 24 24">
        <rect x="3" y="5" width="18" height="14" rx="2" />
        <path d="m3 7 9 6 9-6" />
      </symbol>
      <symbol id="i-chat" viewBox="0 0 24 24">
        <path d="M4 5h16v11H9l-5 4z" />
      </symbol>
      <symbol id="i-check" viewBox="0 0 24 24">
        <path d="m5 12.5 4.5 4.5L19 7.5" />
      </symbol>
      <symbol id="i-trash" viewBox="0 0 24 24">
        <path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13" />
      </symbol>
      <symbol id="i-down" viewBox="0 0 24 24">
        <path d="M12 4v11m-4-4 4 4 4-4M5 20h14" />
      </symbol>
      <symbol id="i-up" viewBox="0 0 24 24">
        <path d="M12 15V4m-4 4 4-4 4 4M5 20h14" />
      </symbol>
      <symbol id="i-search" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="6" />
        <path d="m16 16 4 4" />
      </symbol>
      <symbol id="i-globe" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" />
        <path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18" />
      </symbol>
    </svg>

    <header class="top">
      <div class="wrap top-in">
        <div class="brand">
          <svg class="i"><use href="#i-doc" /></svg
          ><span>Invoice<b>Chaser</b></span>
        </div>
        <div class="tools">
          <select id="currency" aria-label="Currency">
            <option value="EGP">EGP</option>
            <option value="USD">USD</option>
            <option value="SAR">SAR</option>
            <option value="AED">AED</option>
          </select>
          <button class="ghost" id="btnDemo">
            <svg class="i"><use href="#i-plus" /></svg
            ><span data-i18n="demoOn"></span>
          </button>
          <button class="ghost" id="btnReport">
            <svg class="i"><use href="#i-doc" /></svg
            ><span data-i18n="report"></span>
          </button>
          <button class="ghost" id="btnCsv">
            <svg class="i"><use href="#i-down" /></svg
            ><span data-i18n="exportCsv"></span>
          </button>
          <button class="ghost" id="btnPdf">
            <svg class="i"><use href="#i-down" /></svg
            ><span data-i18n="pdf"></span>
          </button>
          <button class="ghost" id="btnBackup">
            <svg class="i"><use href="#i-down" /></svg
            ><span data-i18n="backup"></span>
          </button>
          <button class="ghost" id="btnRestore">
            <svg class="i"><use href="#i-up" /></svg
            ><span data-i18n="restore"></span>
          </button>
          <input
            type="file"
            id="fileRestore"
            accept="application/json"
            hidden
          />
          <button class="ghost" id="btnLang">
            <svg class="i"><use href="#i-globe" /></svg
            ><span id="langLbl"></span>
          </button>
        </div>
      </div>
    </header>

    <main class="wrap">
      <noscript
        ><p class="err">يلزم تفعيل JavaScript لتشغيل التطبيق.</p></noscript
      >

      <section class="hero" aria-labelledby="sOutLbl">
        <div class="hero-top">
          <div>
            <p class="hero-lbl" id="sOutLbl" data-i18n="sOut"></p>
            <p class="hero-num" id="vOut">0</p>
          </div>
          <dl class="hero-side">
            <div>
              <dt data-i18n="sOver"></dt>
              <dd id="vOver">0</dd>
            </div>
            <div>
              <dt data-i18n="sPaid"></dt>
              <dd id="vPaid">0</dd>
            </div>
            <div>
              <dt data-i18n="sRate"></dt>
              <dd id="vRate">0%</dd>
            </div>
          </dl>
        </div>
        <div class="seg" role="img" id="seg">
          <span id="segPaid" class="s-paid"></span
          ><span id="segActive" class="s-active"></span
          ><span id="segOver" class="s-over"></span>
        </div>
        <ul class="legend">
          <li><i class="s-paid"></i><span data-i18n="lgPaid"></span></li>
          <li><i class="s-active"></i><span data-i18n="lgActive"></span></li>
          <li><i class="s-over"></i><span data-i18n="lgOver"></span></li>
        </ul>
      </section>

      <section class="card today" id="todayBox" hidden>
        <h2 data-i18n="todayTitle"></h2>
        <p class="sub" data-i18n="todaySub"></p>
        <ul id="todayList"></ul>
      </section>

      <div class="grid">
        <section class="card form-card">
          <h2 data-i18n="formTitle"></h2>
          <form id="form" novalidate>
            <label
              ><span data-i18n="lblName"></span
              ><input
                id="clientName"
                required
                maxlength="80"
                autocomplete="off"
            /></label>
            <label
              ><span data-i18n="lblPhone"></span
              ><input
                id="clientPhone"
                inputmode="tel"
                dir="ltr"
                placeholder="01012345678"
                autocomplete="off"
            /></label>
            <label
              ><span data-i18n="lblEmail"></span
              ><input
                id="clientEmail"
                type="email"
                dir="ltr"
                placeholder="name@company.com"
                autocomplete="off"
            /></label>
            <div class="row">
              <label
                ><span data-i18n="lblAmount"></span
                ><input id="amount" type="number" min="1" step="any" required
              /></label>
              <label
                ><span data-i18n="lblDue"></span
                ><input id="dueDate" type="date" required
              /></label>
            </div>
            <p class="err" id="formErr" role="alert" hidden></p>
            <button class="primary" type="submit">
              <svg class="i"><use href="#i-plus" /></svg
              ><span data-i18n="addBtn"></span>
            </button>
          </form>
          <details class="set">
            <summary data-i18n="setTitle"></summary>
            <label
              ><span data-i18n="lblBiz"></span
              ><input id="bizName" maxlength="60"
            /></label>
            <label
              ><span data-i18n="lblPay"></span
              ><textarea
                id="payInfo"
                rows="2"
                maxlength="200"
                dir="auto"
              ></textarea>
            </label>
          </details>
        </section>

        <section class="card list-card">
          <div class="list-head">
            <h2 data-i18n="tableTitle"></h2>
            <button class="link" id="btnClear" data-i18n="clearAll"></button>
          </div>
          <div class="controls">
            <div class="search">
              <svg class="i"><use href="#i-search" /></svg
              ><input id="q" type="search" data-i18n-ph="searchPh" />
            </div>
            <select id="sort" aria-label="Sort">
              <option value="due" data-i18n="sortDue"></option>
              <option value="amt" data-i18n="sortAmt"></option>
              <option value="new" data-i18n="sortNew"></option>
            </select>
          </div>
          <div class="tabs" id="tabs" role="tablist"></div>
          <div class="scroll">
            <table>
              <thead>
                <tr>
                  <th data-i18n="thClient"></th>
                  <th data-i18n="thAmount"></th>
                  <th data-i18n="thDue"></th>
                  <th data-i18n="thStatus"></th>
                  <th data-i18n="thAct"></th>
                </tr>
              </thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
          <div class="empty" id="empty">
            <p class="e1" id="e1"></p>
            <p class="e2" id="e2"></p>
          </div>
        </section>
      </div>
    </main>

    <div id="printArea" aria-hidden="true"></div>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden>
      <span id="toastMsg"></span
      ><button id="toastUndo" class="link" hidden></button>
    </div>
    <script src="qr.js"></script>
    <script src="app.js"></script>
  </body>
</html>
